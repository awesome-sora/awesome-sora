name: Create Tag

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: create-tag-main
  cancel-in-progress: false

jobs:
  create_tag:
    if: >-
      github.repository == 'awesome-sora/awesome-sora' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.comment.body, '/create tag ')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Checkout trusted event main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate actor and create one immutable-main tag
        run: python3 .github/scripts/create_tag.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
