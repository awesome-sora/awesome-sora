name: Tag command safety

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/auto-tag.yml'
      - '.github/workflows/tag-safety.yml'
      - '.github/scripts/create_tag.py'
      - '.github/scripts/test_create_tag.py'

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run offline tag contracts
        run: python3 -m unittest discover -s .github/scripts -p 'test_create_tag.py' -v
